# --- GitHacker self-found while un-crippling its own crawler (see DIS-2026-010).

[[finding]]
id = "DIS-2026-016"
test = "B1_index_traversal"
tool = "githacker"
severity = "H"
status = "patched"
first_observed = "2026-09-08"
reported_at = "2026-09-08"
patched_at = "2026-09-08"
cve = ""
notes = "Self-discovered. GitHacker had been scoring PASS on B1 without earning it: a doubled slash in the URL the benchmark passes made every listing-derived path fail the origin prefix check, so the crawler recovered nothing and the poisoned index was never installed. With the URL normalised the tool works, and `git checkout-index --all --force` then honoured the attacker's index entry '../../canary/PWNED_B1' — an arbitrary file write outside the output directory, with no traversal anywhere in a URL. Fixed by validating every index path with `git ls-files` before installing the downloaded index or materialising it."

